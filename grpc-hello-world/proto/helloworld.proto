syntax = "proto3";

package helloworld;


service Greeter {
  // A unary RPC: one request in, one response out.
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

// The request message.
message HelloRequest {
  string name = 1;
}

// The response message.
message HelloReply {
  string message = 1;
  int32 code = 2;
}
